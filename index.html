<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Peluang masuk</title>
<style>
:root{--pri:#FF2E93;--sec:#3A172A;--lav:#09090D;--pink:#111116;--card:#17171F;--tx:#F8F7FA;--tx2:#A5A1B0;--bd:#2B2935;--mk:#3A172A;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;font-family:"Nunito","Inter",system-ui,sans-serif;color:var(--tx);background:linear-gradient(160deg,var(--lav),var(--pink));background-color:var(--lav)}
.wrap{max-width:1000px;margin:0 auto;padding:16px 16px 40px}
nav{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:none}
nav button{white-space:nowrap}
h1{font-size:28px;margin:8px 0;font-weight:800}h2{font-size:15px;margin:18px 0 4px}
button,select,input,textarea{font:inherit;color:var(--tx)}
.btn{border:1.5px solid var(--bd);background:var(--card);border-radius:999px;padding:10px 16px;font-weight:700;cursor:pointer;min-height:44px;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 16px #e83e9822}
.btn.on,.btn.pri{background:linear-gradient(135deg,#f25aa9,var(--pri));color:#fff;border-color:var(--pri)}
.btn.ghost{border-color:transparent;background:none;color:var(--tx2)}
:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.pill{display:inline-block;border:1.5px solid var(--bd);border-radius:999px;padding:4px 12px;font-size:13px;background:var(--pink)}
.badge{background:var(--card);border-radius:999px;padding:2px 12px;font-size:16px;border:1.5px solid var(--bd)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{margin-left:auto}
.tabs{display:flex;gap:6px;overflow-x:auto;border-bottom:1.5px solid var(--bd);margin:10px 0 14px;scrollbar-width:none}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;font-weight:800;color:var(--tx2);cursor:pointer;white-space:nowrap;min-height:44px}
.tabs button.on{color:var(--pri);border-color:var(--pri)}
input,select,textarea{border:1.5px solid var(--bd);border-radius:20px;background:var(--card);padding:12px 16px;width:100%}
.filters{display:grid;grid-template-columns:1fr 180px;gap:10px;margin-bottom:14px}
.card{background:linear-gradient(160deg,var(--card),var(--pink));border:1.5px solid var(--bd);border-radius:28px;padding:18px;box-shadow:0 10px 28px #b0609033;margin-bottom:14px}
.list{display:grid;gap:14px}.list .card{margin:0}
@media(min-width:800px){.list{grid-template-columns:1fr 1fr}}
.av{width:44px;height:44px;border-radius:50%;background:var(--sec);display:grid;place-items:center;font-weight:800;flex:none}
.tw{font-size:19px;line-height:1.5;margin:12px 0;overflow-wrap:anywhere}
mark{background:var(--mk);color:var(--pri);border-radius:8px;padding:0 5px}
.sm{font-size:13px;color:var(--tx2)}
.acts{border-top:1.5px solid var(--bd);margin-top:10px;padding-top:12px}
.acts select{width:auto;padding:8px 12px;border-radius:999px}
.grid2{display:grid;gap:12px}@media(min-width:640px){.grid2{grid-template-columns:1fr 1fr}}
.sk{height:150px;border-radius:28px;background:linear-gradient(90deg,var(--card),var(--pink),var(--card));background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--card);padding:12px 20px;border-radius:999px;opacity:0;pointer-events:none;transition:.25s;z-index:9;max-width:90vw}
#toast.show{opacity:1}
dialog{border:1.5px solid var(--bd);border-radius:28px;background:var(--card);color:var(--tx);width:min(520px,92vw);max-height:90vh;padding:22px}
dialog::backdrop{background:#3b1f3566;backdrop-filter:blur(4px)}
.info{background:linear-gradient(135deg,var(--pink),var(--lav));border:1.5px solid var(--bd);border-radius:20px;padding:14px;margin:12px 0;font-size:14px}
.err{color:#c0265f;font-size:13px;margin:4px 0}
.empty{text-align:center;padding:48px 16px;color:var(--tx2)}
#toast{background:var(--card);color:var(--tx);border:1px solid var(--pri);box-shadow:0 0 18px #ff2e9340}
#nav button.on{box-shadow:inset 3px 0 0 var(--pri),0 0 18px #ff2e9340}
@media(min-width:900px){.wrap{max-width:none;padding-left:250px}#nav{position:fixed;left:0;top:0;bottom:0;width:230px;flex-direction:column;background:var(--pink);border-right:1px solid var(--bd);padding:20px 12px;overflow:auto}#nav button{text-align:left;border-radius:14px}#app{max-width:1100px;margin:0 auto}}
.sc{overflow-x:auto}.tbl{width:100%;border-collapse:collapse;font-size:14px}.tbl th,.tbl td{padding:10px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}.tbl th{color:var(--tx2);font-size:12px;text-transform:uppercase}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:12px 0}@media(min-width:700px){.stats{grid-template-columns:repeat(3,1fr)}}.stat b{font-size:24px;display:block;margin-top:4px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fg label{display:block}.fg input,.fg select{margin-top:4px;padding:10px 12px;border-radius:14px}.full{grid-column:1/-1}
.b-g{color:#22C55E;border-color:#22C55E55}.b-y{color:#F59E0B;border-color:#F59E0B55}.b-r{color:#EF4444;border-color:#EF444455}.b-p{color:var(--pri);border-color:#FF2E9355}.b-x{color:var(--tx2)}
.bar{height:10px;border-radius:9px;background:linear-gradient(90deg,var(--pri),#A855F7)}
.ev{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}.ev img{width:100%;height:100px;object-fit:cover;border-radius:12px;cursor:pointer}
@media print{#nav,.noprint{display:none!important}.wrap{padding:0}body{background:#fff;color:#000}}
</style></head><body><div class="wrap">
<nav id="nav" aria-label="Navigasi utama"></nav><main id="app"></main></div>
<div id="toast" role="status" aria-live="polite"></div><dialog id="dlg"></dialog>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const st={get(k,d){try{const v=localStorage.getItem('pm:'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('pm:'+k,JSON.stringify(v))}catch(e){}}};
const DEF={tags:'zonauang, bealanja',buy:'wtb, cari, nyari, butuh, mau beli, mau, pengen, adakah, ada yang jual, ada yg jual, info, want to buy, need',ign:'wts, open order, ready stock, ready stok, jual akun, price list, pricelist, jasa convert, giveaway, stock melimpah, stok melimpah'};
const DEFP=[['Netflix',''],['Canva',''],['Capcut','cap cut'],['Spotify',''],['ChatGPT','chat gpt'],['YouTube','youtube premium'],['Prime Video','amazon prime'],['Vidio',''],['Disney+','hotstar']].map(([n,k],i)=>({id:'p'+i,name:n,kw:k,on:true,def:true}));
let cfg=st.get('cfg',DEF),prods=st.get('prods',DEFP),tpl=st.get('tpl',{}),ls=st.get('ls',{});
const S={view:'dash',tab:'Semua',q:'',prod:'',page:1,loading:true};
const TABS=['Semua','Baru','Ditindaklanjuti','Selesai','Dial'];
const RAW=[[1,'Pika','pixypaw',51,'butuh cepet netflix 3 hari #zonauang'],[2,'Rani','ranirn',12,'wtb canva pro 1 bulan, ada yang jual? #bealanja'],[3,'Dimas','dimasaja',25,'nyari spotify premium family murah dong'],[4,'Salsa','salsabila',40,'pengen chatgpt plus tapi mahal, ada yg patungan? #zonauang'],[5,'Bayu','bayuu',66,'need capcut pro buat edit video, adakah yang jual?'],[6,'Nadia','nadiaa',90,'mau beli youtube premium 1 bulan #bealanja'],[7,'Eko','ekoprast',130,'ready stock netflix murah wts'],[8,'Putri','putri_',150,'cari vidio platinum sebulan, dm ya'],[9,'Tara','taraa',200,'butuh disney+ hotstar buat nonton bola'],[10,'Gita','gitaa',300,'info prime video sharing dong #zonauang'],[11,'Lia','lialia',420,'mau canva edu tapi nggak tau caranya']].map(([id,n,u,m,t])=>({id:'demo'+id,tid:'19000000000000'+id,name:n,user:u,min:m,text:t}));
const list=s=>s.split(/[,\n]/).map(x=>x.trim().replace(/^#/,'')).filter(Boolean);
const re=(p,pre='')=>new RegExp('(?<![\\p{L}\\p{N}_])'+pre+p.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(?![\\p{L}\\p{N}_])','giu');
function match(t){
  if(list(cfg.ign).some(p=>re(p).test(t)))return null;
  const R=[],hit=(p,pre)=>{const o=[];for(const m of t.matchAll(re(p,pre)))o.push([m.index,m.index+m[0].length]);R.push(...o);return o.length>0};
  const buy=list(cfg.buy).filter(p=>hit(p)),tags=list(cfg.tags).filter(p=>hit(p,'#'));
  const ps=prods.filter(p=>p.on&&[p.name,...list(p.kw)].some(k=>hit(k)));
  if(!buy.length||!ps.length)return null;
  R.sort((a,b)=>a[0]-b[0]);const M=[];for(const r of R){const l=M[M.length-1];if(l&&r[0]<=l[1])l[1]=Math.max(l[1],r[1]);else M.push([...r])}
  let h='',i=0;for(const [a,b] of M){h+=esc(t.slice(i,a))+'<mark>'+esc(t.slice(a,b))+'</mark>';i=b}h+=esc(t.slice(i));
  return{html:h,product:ps[0].name,buy,tags,reason:'Cocok: '+[...buy,...tags.map(x=>'#'+x)].join(' · ')};
}
const leads=()=>src().map(r=>{const m=match(r.text);return m&&{...r,...m,status:ls[r.id]?.s||'Baru',bm:!!ls[r.id]?.b}}).filter(Boolean);
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2600)}
const tplOf=n=>tpl[n]??`hai kak, ready ${n} yaa ♡`;
const ago=m=>m<60?m+' menit lalu':Math.floor(m/60)+' jam lalu';
const VIEWS=[['dash','▦ Dashboard'],['leads','◎ Peluang Masuk'],['ord','🧾 Rekap Orderan'],['prods','▣ Produk Pantauan'],['kw','# Hashtag & Kata Kunci'],['tpl','✎ Template Promosi']];
function nav(){$('#nav').innerHTML=VIEWS.map(([k,l])=>`<button class="btn ${S.view===k?'on':''}" data-a="go" data-v="${k}">${l}</button>`).join('')}
function filtered(skipTab){const q=S.q.toLowerCase();return leads().filter(l=>(!S.prod||l.product===S.prod)&&(!q||[l.name,l.user,l.text,...l.buy].join(' ').toLowerCase().includes(q))&&(skipTab||S.tab==='Semua'||l.status===S.tab))}
function viewLeads(){
  const all=leads();
  $('#app').innerHTML=`<div class="row"><h1>Peluang masuk</h1><span class="badge">${all.length}</span><span class="pill ${cfgX.url?'b-g':''}" title="${cfgX.url?'Data dari X via proxy Anda':'Data contoh, bukan dari X'}">${cfgX.url?'Mode Live':'Mode Demo'}</span><button class="btn ghost sp" data-a="csv">⬇ Ekspor CSV</button></div>
  <div class="tabs" id="tabs"></div>
  <div class="filters"><input id="q" type="search" placeholder="Cari nama atau isi tweet" aria-label="Cari" value="${esc(S.q)}"><select id="pf" aria-label="Filter produk"><option value="">Semua produk</option>${prods.filter(p=>p.on).map(p=>`<option ${S.prod===p.name?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div>
  <div id="list"></div>`;
  tabs();rlist();
}
function tabs(){const b=filtered(true);$('#tabs').innerHTML=TABS.map(t=>`<button class="${S.tab===t?'on':''}" data-a="tab" data-t="${t}">${t} <span class="sm">${t==='Semua'?b.length:b.filter(l=>l.status===t).length}</span></button>`).join('')}
function rlist(){
  const el=$('#list');
  if(S.loading){el.innerHTML='<div class="list"><div class="sk"></div><div class="sk"></div></div>';return}
  const a=filtered(),v=a.slice(0,S.page*6);
  if(!a.length){el.innerHTML='<div class="empty"><div style="font-size:48px">🌸</div><b>Belum ada peluang</b><p>Coba ubah kata pencarian, filter, atau kata kunci.</p></div>';return}
  el.innerHTML='<div class="list">'+v.map(l=>`<article class="card"><div class="row"><div class="av">${esc(l.name[0])}</div><div><b style="font-size:18px">${esc(l.name)}</b><div class="sm">@${esc(l.user)} · ${ago(l.min)}</div></div><span class="pill sp">${l.status}</span><button class="btn ghost" style="padding:6px" data-a="bm" data-id="${l.id}" aria-pressed="${l.bm}" aria-label="Bookmark">${l.bm?'★':'☆'}</button></div>
  <div class="row" style="margin-top:10px"><span class="pill">${esc(l.product)}</span><span class="pill">Mencari produk</span><span class="pill sm">Feed demo</span></div>
  <p class="tw">${l.html}</p><div class="sm">✓ ${esc(l.reason)}</div>
  <div class="row acts"><button class="btn pri" data-a="reply" data-id="${l.id}">↗ Balas pakai template</button><button class="btn" data-a="mkord" data-id="${l.id}">＋ Buat Order</button>${db.o.filter(o=>o.lead===l.id).map(o=>`<button class="pill b-g" data-a="det" data-id="${o.id}">${o.no}</button>`).join('')}<a class="sm" href="https://x.com/${esc(l.user)}/status/${l.tid}" target="_blank" rel="noopener">Buka tweet ↗</a>
  <select class="sp" data-c="status" data-id="${l.id}" aria-label="Status lead">${TABS.slice(1).map(t=>`<option ${t===l.status?'selected':''}>${t}</option>`).join('')}</select></div></article>`).join('')+'</div>'+(a.length>v.length?'<div class="row" style="justify-content:center;margin-top:14px"><button class="btn" data-a="more">Muat lebih banyak</button></div>':'');
}
function viewKw(){
  $('#app').innerHTML=`<h1>Hashtag & kata kunci</h1><p class="sm">Tentukan percakapan yang ingin kamu temukan.</p><form class="card" id="kf" novalidate>
  ${[['tags','Hashtag pantauan','Pisahkan dengan koma atau baris baru. Maksimal 8 hashtag.'],['buy','Tanda ingin membeli','Pisahkan dengan koma atau baris baru, maksimal 20 frasa. Tweet harus memuat minimal satu.'],['ign','Abaikan kata','Pisahkan dengan koma atau baris baru, maksimal 30 frasa. Boleh dikosongkan.']].map(([k,l,d])=>`<h2><label for="k_${k}">${l}</label></h2><p class="sm">${d}</p><textarea id="k_${k}" rows="4">${esc(cfg[k])}</textarea><div class="err" id="e_${k}"></div>`).join('')}
  <div class="row" style="margin-top:14px"><button class="btn pri" type="submit">Simpan Pengaturan</button><button class="btn" type="button" data-a="kreset">Reset ke default</button></div></form>`;
}
function viewProds(){
  $('#app').innerHTML=`<h1>Produk pantauan</h1><p class="sm">Pilih minimal satu atau tambahkan aplikasi sendiri.</p><button class="btn" data-a="padd">＋ Tambah aplikasi</button><div class="grid2" style="margin-top:14px">${prods.map(p=>`<div class="card" style="margin:0"><div class="row"><div class="av">${esc(p.name[0])}</div><b>${esc(p.name)}</b><input type="checkbox" class="sp" style="width:24px;height:24px" data-c="pon" data-id="${p.id}" ${p.on?'checked':''} aria-label="Pantau ${esc(p.name)}"></div><div class="sm" style="margin:8px 0">${p.def?'Aplikasi bawaan':'Aplikasi kustom'}${p.kw?' · '+esc(p.kw):''}</div><div class="row" style="justify-content:flex-end"><button class="btn ghost" data-a="pedit" data-id="${p.id}">✎ Ubah</button><button class="btn" data-a="pdel" data-id="${p.id}" aria-label="Hapus ${esc(p.name)}">🗑</button></div></div>`).join('')}</div>`;
}
function viewTpl(){
  $('#app').innerHTML=`<h1>Template promosi</h1><p class="sm">Template balasan per produk. Disimpan di perangkat ini.</p><div class="grid2">${prods.map(p=>`<div class="card" style="margin:0"><label><b>${esc(p.name)}</b><textarea rows="3" data-c="tpl" data-n="${esc(p.name)}" style="margin-top:8px">${esc(tplOf(p.name))}</textarea></label></div>`).join('')}</div>`;
}
function render(){nav();({dash:viewDash,ord:viewOrd,leads:viewLeads,kw:viewKw,prods:viewProds,tpl:viewTpl})[S.view]()}
const dlg=$('#dlg'),open=h=>{dlg.innerHTML=h;dlg.showModal()},close=()=>dlg.close();
function replyModal(id){
  const l=leads().find(x=>x.id===id);if(!l)return;
  const on=prods.filter(p=>p.on);
  open(`<label><b>Aplikasi</b><select id="rp" style="margin:8px 0 14px">${on.map(p=>`<option ${p.name===l.product?'selected':''}>${esc(p.name)}</option>`).join('')}</select></label>
  <label><b>Teks balasan</b><textarea id="rt" rows="5" style="margin-top:8px">${esc(tplOf(l.product))}</textarea></label>
  <p class="sm">Perubahan di sini hanya untuk balasan ini. Template tetap bisa diatur di menu Template promosi.</p>
  <label class="sm"><input type="checkbox" id="rs" style="width:auto"> Simpan sebagai template permanen</label>
  <div class="info">Kamu perlu login ke X. Teks akan dibawa ke composer jika didukung; periksa tujuan dan isinya, lalu tekan kirim di X. Status lead tidak diubah otomatis.${l.id.startsWith('demo')?'<br><b>Mode Demo:</b> tweet ini data contoh, jadi tujuan balasan di X tidak valid.':''}</div>
  <div class="row" style="justify-content:flex-end"><button class="btn" data-a="close">Tutup</button><button class="btn" data-a="copy">Salin</button><button class="btn pri" data-a="openx" data-id="${l.id}">Buka balasan di X ↗</button></div>`);
}
function prodForm(p){
  open(`<h2 style="margin-top:0">${p?'Ubah aplikasi':'Tambah aplikasi'}</h2><label>Nama<input id="pn" value="${esc(p?.name||'')}" maxlength="30"></label><label style="display:block;margin-top:10px">Keyword terkait (pisahkan koma)<input id="pk" value="${esc(p?.kw||'')}"></label><div class="err" id="pe"></div><div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn" data-a="close">Batal</button><button class="btn pri" data-a="psave" data-id="${p?.id||''}">Simpan</button></div>`);
}
const acts={
  go(d){S.view=d.v;render()},tab(d){S.tab=d.t;S.page=1;tabs();rlist();$('#tabs')&&0},more(){S.page++;rlist()},close,
  bm(d){const o=ls[d.id]||{};ls[d.id]={...o,b:!o.b};st.set('ls',ls);rlist()},
  reply(d){replyModal(d.id)},
  copy(){navigator.clipboard?.writeText($('#rt').value).then(()=>toast('Teks disalin'),()=>toast('Gagal menyalin, salin manual'))},
  openx(d){const t=$('#rt').value,n=$('#rp').value;if($('#rs').checked){tpl[n]=t;st.set('tpl',tpl)}
    navigator.clipboard?.writeText(t).catch(()=>{});
    window.open(`https://x.com/intent/post?in_reply_to=${src().find(r=>r.id===d.id).tid}&text=${encodeURIComponent(t)}`,'_blank','noopener');
    close();toast('Composer dibuka. Balasan belum terkirim; teks juga disalin sebagai cadangan.')},
  csv(){const a=filtered(),q=v=>'"'+String(v).replace(/"/g,'""')+'"';
    const c=[['id_tweet','nama','username','waktu','produk','keyword','status','bookmark','teks'].join(','),...a.map(l=>[l.tid,l.name,l.user,ago(l.min),l.product,l.buy.join('|'),l.status,l.bm,l.text].map(q).join(','))].join('\n');
    try{const u=URL.createObjectURL(new Blob(['\ufeff'+c],{type:'text/csv'})),x=document.createElement('a');x.href=u;x.download='peluang-masuk.csv';x.click()}catch(e){}
    navigator.clipboard?.writeText(c).then(()=>toast(`${a.length} lead diekspor; CSV juga disalin`),()=>toast(`${a.length} lead diekspor`))},
  kreset(){if(confirm('Kembalikan semua pengaturan ke default?')){cfg={...DEF};st.set('cfg',cfg);viewKw();toast('Pengaturan direset')}},
  padd(){prodForm()},pedit(d){prodForm(prods.find(p=>p.id===d.id))},
  psave(d){const n=$('#pn').value.trim();if(!n)return $('#pe').textContent='Nama wajib diisi';
    if(prods.some(p=>p.id!==d.id&&p.name.toLowerCase()===n.toLowerCase()))return $('#pe').textContent='Nama sudah dipakai';
    if(d.id){const p=prods.find(x=>x.id===d.id);p.name=n;p.kw=$('#pk').value.trim()}else prods.push({id:'c'+Date.now(),name:n,kw:$('#pk').value.trim(),on:true,def:false});
    st.set('prods',prods);close();viewProds();toast('Produk disimpan')},
  pdel(d){const p=prods.find(x=>x.id===d.id);open(`<h2 style="margin-top:0">Hapus ${esc(p.name)}?</h2><p>${p.def?'Ini aplikasi bawaan. ':''}Pemantauan produk ini akan berhenti.</p><div class="row" style="justify-content:flex-end"><button class="btn" data-a="close">Batal</button><button class="btn pri" data-a="pdel2" data-id="${p.id}">Ya, hapus</button></div>`)},
  pdel2(d){prods=prods.filter(p=>p.id!==d.id);st.set('prods',prods);close();viewProds();toast('Produk dihapus')}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b)acts[b.dataset.a]?.(b.dataset)});
document.addEventListener('change',e=>{const t=e.target,d=t.dataset;

else if(t==='Garansi & Klaim')b=`<div class="fg">${fld('w_st','Mulai garansi (hari ini = hari ke-1)',o.w.start,'date')}<label class="sm">Durasi (hari)<select id="w_d">${[1,3,7,14,30].map(x=>`<option ${x===o.w.dur?'selected':''}>${x}</option>`).join('')}</select></label>${fld('w_tm','Syarat garansi',o.w.terms).replace('<label','<label class="full"')}</div><div class="sm" style="margin:8px 0">Berakhir: ${dt(wend(o))} · ${bdg(wst(o),'b-p')}</div><button class="btn pri" data-a="wsave" data-id="${id}">Simpan garansi</button><h2>Klaim</h2>${o.w.claims.map((k,i)=>`<div class="card" style="margin:6px 0;padding:10px"><b>${k.id}</b> ${dt(k.date)} · ${esc(k.c)}<br>${sel('k'+i,CS,k.s,`data-o="kst" data-id="${id}" data-i="${i}"`)}<input placeholder='Catatan akun pengganti (riwayat akun lama tetap)' value="${esc(k.rep||'')}" data-o='krep' data-id="${id}" data-i="${i}" style='margin-top:6px'></div>`).join('')||'<p class="sm">Belum ada klaim.</p>'}<div class="fg">${fld('k_c','Keluhan customer','').replace('<label','<label class="full"')}</div><button class="btn" data-a="clm" data-id="${id}" style="margin-top:8px">Buat klaim</button>`;

/* ===== ADAPTER X (Mode Live lewat proxy server milik Anda) ===== */
let cfgX=st.get('x',{url:'',min:15}),LIVE=st.get('live',[]),pulling=false,tm;
const src=()=>cfgX.url?LIVE.map(r=>({...r,min:Math.max(0,Math.round((Date.now()-r.ts)/60000))})):RAW;
async function pull(manual){if(!cfgX.url||pulling)return;pulling=true;try{
const tg=list(cfg.tags).map(t=>'#'+t),by=list(cfg.buy).slice(0,8).map(b=>'"'+b+'"'),pn=prods.filter(p=>p.on).slice(0,8).map(p=>'"'+p.name+'"');
const q='('+[...tg,...pn].join(' OR ')+') ('+by.join(' OR ')+') -is:retweet';
const r=await fetch(cfgX.url+(cfgX.url.includes('?')?'&':'?')+'q='+encodeURIComponent(q));
if(r.status===429)throw new Error('batas rate X tercapai, coba lagi nanti');if(!r.ok)throw new Error('proxy membalas '+r.status);
const j=await r.json(),us={};(j.includes?.users||[]).forEach(u=>us[u.id]=u);const seen=new Set(LIVE.map(x=>x.tid));let n=0;
(j.data||[]).forEach(t=>{if(seen.has(t.id))return;const u=us[t.author_id]||{};LIVE.unshift({id:'x'+t.id,tid:t.id,name:u.name||'?',user:u.username||'i/web',ts:Date.parse(t.created_at),text:t.text});n++});
LIVE=LIVE.slice(0,500);st.set('live',LIVE);cfgX.last=new Date().toISOString();st.set('x',cfgX);manual&&toast(n+' tweet baru');
S.view==='leads'&&(tabs(),rlist());S.view==='dash'&&viewDash()}catch(e){toast('Gagal menarik data X: '+e.message)}pulling=false}
const poll=()=>{clearInterval(tm);if(cfgX.url)tm=setInterval(pull,cfgX.min*60000)};poll();
Object.assign(acts,{xsave(){const u=$('#x_u').value.trim();if(u&&!/^https:\/\//.test(u))return toast('URL harus diawali https://');cfgX.url=u;cfgX.min=+$('#x_m').value;st.set('x',cfgX);poll();viewDash();toast(u?'Mode Live aktif':'Kembali ke Mode Demo');u&&pull(true)},xpull(){cfgX.url?pull(true):toast('Isi URL proxy dulu')}});
render();setTimeout(()=>{S.loading=false;S.view==='leads'&&rlist()},600);
